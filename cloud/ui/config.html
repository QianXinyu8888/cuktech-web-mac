<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>远程设备配置</title>
</head>
<body class="remote-config-page">
    <main class="remote-config-notice" data-remote-config>
        <a href="/" data-remote-back>返回仪表盘</a>
        <h1>远程设备配置</h1>
        <p>在此管理网关、查看已撤销设备的历史记录，以及获取配网凭据。</p>
        <div class="remote-actions" data-remote-actions></div>
        <h2>在 Mac 上配网</h2>
        <p>先在 Mac 版配置页扫码导入米家设备，再在项目目录运行 <code>.venv/bin/python macos/esp_setup.py</code>。按助手提示连接 ESP32 热点，并输入注册网关后显示的一次性凭据。</p>
    </main>
</body>
</html>
