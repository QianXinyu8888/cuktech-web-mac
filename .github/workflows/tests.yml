name: Software regression and publication guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip 'setuptools>=84.1.0' wheel
      - run: python -m pip install -e 'src/cuktech-ble-ha-main/ble_server[dev]'
      - run: python -m pytest tests src/cuktech-ble-ha-main/ble_server/tests -q
      - run: python -m pytest src/cuktech-ble-ha-main/ha_integration/tests -q
      - name: Frontend checks
        run: |
          for file in src/cuktech-ble-ha-main/ble_server/tests/js/*_test.js; do
            node "$file" || exit 1
          done
      - run: python scripts/check_publication.py
      - name: Dependency vulnerability audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit
      - name: Shell syntax
        run: |
          find macos -name '*.sh' -exec bash -n {} \;
          for file in *.command; do bash -n "$file" || exit 1; done
      - run: bash macos/build_app.sh
